name: HTML RVM S1A — Pages preview

on:
  push:
    branches: [feat/s1a-memory-working-json]
    paths:
      - "site/**"
      - "src/**"
      - "tools/build-pages.mjs"
      - "tests/**"
      - ".github/workflows/pages-preview.yml"
      - "requirements/**"
      - "docs/S1A-PAGES.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-rvm-pages-preview
  cancel-in-progress: true

jobs:
  test-build:
    name: Validate and package static preview
    if: github.ref == 'refs/heads/feat/s1a-memory-working-json'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Run all structural, contract and Pages tests
        run: npm test
      - name: Build static site with exact HEAD marker
        run: node tools/build-pages.mjs
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Publish draft S1A Playground to GitHub Pages
    if: github.ref == 'refs/heads/feat/s1a-memory-working-json'
    needs: test-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish only after successful tests
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
