name: HTML RVM — architecture bootstrap
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structural:
    name: Draft documents and boundary — structural checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Structural and negative bootstrap tests (NOT runtime conformance)
        run: npm test

  repo-guard:
    name: RepoGuard exact BASE/HEAD — compiler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head with full Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Causal requirements compiler, pinned release
        id: guard
        uses: netkeep80/repo-guard@74db97791e6da8a75287164f0d0b41579108f114
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          node-version: "24"
      - name: Report actual verdict, no bypass
        if: always()
        env:
          RESULT: ${{ steps.guard.outputs.result }}
          SUMMARY: ${{ steps.guard.outputs.summary }}
        run: |
          printf '%s\n' "$RESULT" "$SUMMARY"
