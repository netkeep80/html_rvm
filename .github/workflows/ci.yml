name: HTML RVM — S0 and S1A contract checks
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structural:
    name: S0 structural and S1A runtime contract tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Run S0 structural + S1A read-only runtime tests (NOT full conformance)
        run: npm test

  repo-guard:
    name: RepoGuard exact BASE/HEAD — compiler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head with full Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Causal requirements compiler, pinned release
        id: guard
        uses: netkeep80/repo-guard@74db97791e6da8a75287164f0d0b41579108f114
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          node-version: "24"
      - name: Report actual verdict, no bypass
        if: always()
        env:
          RESULT: ${{ steps.guard.outputs.result }}
          SUMMARY: ${{ steps.guard.outputs.summary }}
        run: |
          printf '%s\n' "$RESULT" "$SUMMARY"
      - name: Checkout pinned compiler for full diagnostics (failure remains failure)
        if: failure()
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          path: .rg-diagnostics
          persist-credentials: false
      - name: Explain exact RepoGuard RED (not a bypass)
        if: failure()
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          (cd .rg-diagnostics && npm install --omit=dev --silent)
          node .rg-diagnostics/dist/repo-guard.mjs --repo-root "$PWD" check --base "$BASE" --head "$HEAD" --format json > "$RUNNER_TEMP/rg-report.json" || true
          node --input-type=module - "$RUNNER_TEMP/rg-report.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(process.argv[2], "utf8"));
          console.log(JSON.stringify({
            ok: report.ok, base: report.base, head: report.head,
            j1: report.j1, j2: report.j2, j3: report.j3,
            diagnostics: report.diagnostics
          }, null, 2));
          NODE
