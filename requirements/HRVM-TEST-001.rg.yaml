    target: { kind: requirement, id: HRVM-PROJECT-000 }
  - predicates: [ documents ]
    target: { kind: artifact, path: "docs/DOCUMENT-PORT-1.md" }
  - predicates: [ documents ]
    target: { kind: artifact, path: "docs/ROADMAP.md" }
