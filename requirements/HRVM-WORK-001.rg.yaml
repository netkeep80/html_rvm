format: repo-guard/requirement-v1
id: HRVM-WORK-001
normative: "### HRVM-WORK-001 — Исполнение Модели Отношений MUST происходить над отдельным временным изменяемым рабочим JSON-состоянием, материализованным из проверенного immutable snapshot DocumentReader, и MUST NOT происходить непосредственно над HTML DBMS, её криптографическими цепочками или опубликованным состоянием провайдера. Самомодификация отношений MAY выполнять произвольно много внутренних JSON-изменений без каких-либо DBMS append/commit и без изменений открытого snapshot. Ни одна такая рабочая мутация, завершение исполнения или таймер MUST NOT автоматически вызывать сохранение. Несколько рабочих исполнений от одного снимка MUST быть изолированы."
lifecycle: { accepted: false, current: false, published: false }
