format: repo-guard/requirement-v1
id: HRVM-MO-PC1-E2-001
normative: "### HRVM-MO-PC1-E2-001 — Исследовательский PC1-R2-E2 carrier probe MUST сравнивать JS/JSON-near control, принятый R0 N/P + E1 control и homogeneous JavaScript duplet-array carrier на общей ограниченной системе наблюдений W1–W8 с фактическим исполнением принятого E1 как B-oracle и явными отображениями carrier identity. Все сравниваемые наблюдения MUST извлекаться из фактических returned state/trace/entries, а не из ожидаемых констант; общий W2 MUST включать shared-vs-distinct mutation discriminator; H/V/Q MUST сравнивать identity-bearing evidence fields и post-state, bundle MUST сравнивать returned occurrence order. C MUST сохранять замкнутость каждого принятого состояния под собственным lossless codec и перед любой frame-интерпретацией заново валидировать bounded frame/roles/EO/RS shape, mutable role slots и parent chain; raw topology MAY перестать быть frame, но тогда H/V/Q/branch writes MUST reject до записи. Atom-carrier mutation MUST reject; atomic rejects MUST validate before allocation/write; delete MUST быть append-only/no-reuse с tombstone semantics. A Q MUST полностью валидировать target identity shape в preflight: malformed id => unchanged state/empty trace, well-shaped missing identity => runtime missing-target с разрешённым prefix commit. Contextual object-key addressing MUST следовать уже принятому JSON-pointer token decoding; array-index typing и duplicate-key ambiguity явно остаются вне admitted E2 A/B/C correspondence domain. DUPLET-DERIVED MUST означать выводимость относительно atom/bootstrap/shape conventions, а bundle functional predicate MUST быть отделён от external preserveOccurrenceIdentity disposition policy. Pair interning, индексы/БД, native code, общий интерпретатор, финальная grammar selection и carrier selection запрещены в E2. E2-R3 является последним плановым corrective cycle: PASS/PASS_SCOPED ведут к author decision и natural JSON slice; повторный BLOCK сохраняет E2 как незавершённое исследование, но не блокирует продолжение программы от принятого E1."
