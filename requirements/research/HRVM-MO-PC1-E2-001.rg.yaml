format: repo-guard/requirement-v1
id: HRVM-MO-PC1-E2-001
normative: "### HRVM-MO-PC1-E2-001 — Исследовательский PC1-R2-E2 carrier probe MUST сравнивать JS/JSON-near control, принятый R0 N/P + E1 control и homogeneous JavaScript duplet-array carrier на общей ограниченной системе наблюдений W1–W8 с фактическим исполнением принятого E1 как B-oracle и явными отображениями carrier identity; C MUST сохранять замкнутость каждого принятого состояния под собственным lossless codec, валидировать atomic rejects до аллокации, запрещать мутацию atom-carrier, сохранять append-only/no-reuse lifetime при delete, а H/V/Q evidence MUST быть отдельной immutable identity-based трассой с semanticChange/no-op/reject наблюдениями; contextual object-key addressing MUST следовать уже принятому JSON-pointer token decoding, при этом array-index typing остаётся вне E2; DUPLET-DERIVED MUST означать выводимость относительно явно объявленных atom/bootstrap/shape conventions, а bundle functional predicate MUST быть отделён от внешней preserveOccurrenceIdentity disposition policy. Pair interning, индексы/БД, native code, общий интерпретатор, финальная grammar selection и carrier selection запрещены в E2."
