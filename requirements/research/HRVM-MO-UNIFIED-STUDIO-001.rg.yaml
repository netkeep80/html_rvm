id: HRVM-MO-UNIFIED-STUDIO-001
normative: "### HRVM-MO-UNIFIED-STUDIO-001 — Unified MO Studio MUST provide a single Natural JSON, as-network, Context/Result and execution timeline workspace, with exact relation identities and B/E references, explicit draft/applied/branch/layout separation, real shared Run/Step execution and atomic reject, reflective source-role mutation and re-execution, no hidden persistence, and migration of retained legacy obligations before removing old interfaces. PC2 EXEC integration MUST invoke the accepted shared executor on live applied state, retain whole returned session on explicit adoption, atomically reject manual edits that invalidate or modify adopted namespace root duplets while preserving all session components, distinguish final-state trace inspection from real Step, separate attempted reject trace and committed state, and disclose E1-only export and measured comparison scope (Issue #52). Stage 3 partial implementation is not completion or production acceptance; carrier selection and historical where copy/alias parity remain OPEN. Authority: Issue #45 and author decision #45/7220762521."
