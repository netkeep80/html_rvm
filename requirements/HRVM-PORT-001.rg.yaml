format: repo-guard/requirement-v1
id: HRVM-PORT-001
normative: "### HRVM-PORT-001 — DocumentPort/1 MUST определять DocumentReader.openSnapshot(reference?) и DocumentReader.read(snapshot, documentId). DocumentWriter.commit(base, changes) MUST быть отдельной необязательной capability хоста. Данные и изменения MUST быть выражены через JSONValue и RFC 6902 JSON Patch; обработка $ref и исполнение отношений MUST NOT входить в DocumentPort. Версия DocumentPort MUST быть независимой от версии DBMS и версии языка МО."
lifecycle: { accepted: false, current: false, published: false }
