    target: { kind: requirement, id: HRVM-ARCH-001 }
  - predicates: [ documents ]
    target: { kind: artifact, path: "docs/DOCUMENT-PORT-1.md" }
  - predicates: [ documents ]
    target: { kind: artifact, path: "ports/document-port.d.ts" }
