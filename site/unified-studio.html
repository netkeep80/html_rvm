<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MO Studio — development preview</title><link rel="stylesheet" href="unified-studio.css"><script type="module" src="unified-studio.js"></script></head><body>
<header><strong>HTML RVM · MO Studio</strong><label>Пример <select id="example"></select></label><button id="apply">Apply</button><button id="run">Run ▶</button><button id="step">Step ▷</button><button id="reset">Reset run</button><button id="discard">Discard draft</button><span id="version"></span></header>
<p id="status" role="status"></p>
<main><section><h2>Natural JSON</h2><textarea id="source" spellcheck="false" aria-label="Natural JSON"></textarea><p id="projection-note"></p><div id="occurrences"></div><button id="inspect">Показать контекст ORS</button><button id="reflect">Q: is_string ↔ is_null</button></section>
<section><h2>Асеть дуплетов <small>B/E → идентичность</small></h2><p class="hint">Тело — раскладка. B/E — перетащите на центр другой идентичности. Изменяется применённая модель.</p><button id="layout-reset">Автораскладка</button><div class="canvas"><svg id="network" xmlns="http://www.w3.org/2000/svg" aria-label="Асеть дуплетов"></svg></div></section>
<section><h2>Context / Result</h2><pre id="selection"></pre><h3>Контекст</h3><pre id="context"></pre><h3>Результат</h3><pre id="result"></pre><div id="result-occurrences"></div><details><summary>Exact applied state</summary><pre id="exact"></pre><button id="export-exact">Export exact</button><label>Import exact <input id="import-exact" type="file" accept=".json"></label></details></section></main>
<footer><h2>Execution timeline</h2><div id="timeline"></div><pre id="transition-detail"></pre><p>Development preview · без записи в DBMS</p></footer></body></html>
